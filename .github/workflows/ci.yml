name: CI

permissions:
    contents: read

on:
    pull_request:
    push:
        branches: [main]

jobs:
    build-and-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck, lint, format, test
              run: npm run check

            - name: Build
              run: npm run build

            - name: Enforce initial JS bundle gzip budget
              run: |
                  node -e "
                  const fs = require('fs');
                  const path = require('path');
                  const zlib = require('zlib');

                  const BUDGET_BYTES = 61440; // 60 KB
                  const MANIFEST_PATH = 'dist/web/.vite/manifest.json';

                  // Load and parse manifest
                  if (!fs.existsSync(MANIFEST_PATH)) {
                    console.error('::error::Build manifest not found at ' + MANIFEST_PATH);
                    process.exit(1);
                  }

                  const manifest = JSON.parse(fs.readFileSync(MANIFEST_PATH, 'utf-8'));

                  // Find all entry chunks (isEntry: true)
                  const entryChunks = [];
                  for (const [key, entry] of Object.entries(manifest)) {
                    if (entry.isEntry === true && entry.file) {
                      entryChunks.push(entry.file);
                    }
                  }

                  if (entryChunks.length === 0) {
                    console.error('::error::Build manifest contains no entry chunks');
                    process.exit(1);
                  }

                  // Calculate total gzipped size of entry chunks
                  let total = 0;
                  for (const file of entryChunks) {
                    const fullPath = path.join('dist/web', file);
                    if (!fs.existsSync(fullPath)) {
                      console.error('::error::Entry chunk file not found: ' + fullPath);
                      process.exit(1);
                    }
                    const content = fs.readFileSync(fullPath);
                    const gzipped = zlib.gzipSync(content);
                    const size = gzipped.length;
                    console.log(fullPath + ': ' + size + ' bytes gzipped');
                    total += size;
                  }

                  console.log('Total initial JS gzipped: ' + total + ' bytes (budget: ' + BUDGET_BYTES + ')');

                  if (total > BUDGET_BYTES) {
                    console.error('::error::Initial JS bundle (' + total + ' bytes gzipped) exceeds the ' + BUDGET_BYTES + ' byte budget');
                    process.exit(1);
                  }
                  "
