name: CI

permissions:
    contents: read

on:
    pull_request:
    push:
        branches: [main]

jobs:
    build-and-check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Typecheck, lint, format, test
              run: npm run check

            - name: Build
              run: npm run build
